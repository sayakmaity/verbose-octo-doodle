<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h1>Gmail Code Clipper</h1>

    <div class="section">
      <div class="status-row">
        <span id="status-dot" class="dot off"></span>
        <span id="status-text">Not set up</span>
      </div>
      <div id="status-note" class="note" hidden></div>
      <div class="btn-row">
        <button id="setup-btn" class="btn">Set Up Monitoring</button>
        <button id="download-btn" class="btn" hidden>Download on-device model</button>
      </div>
    </div>

    <div class="section">
      <label>Recent Codes</label>
      <div id="history" class="history">
        <div class="empty">No codes detected yet</div>
      </div>
    </div>
  </div>
  <script src="nano.js"></script>
  <script src="popup.js"></script>
</body>
</html>
